name: manual test
on:
  workflow_dispatch

jobs:
  do-some:
    runs-on: ubuntu-latest
    environment: develop
    env:
      LOCAL_NODE_VERSION: ${{ vars.NODE_VERSION }}
    steps:   
      - name: Read a global variable $NODE_VERSION
        run: echo "My global NODE_VERSION value is $NODE_VERSION"
      
      - uses: actions/setup-node@v4
        with:
          node-version: $LOCAL_NODE_VERSION
      - run: node --version
