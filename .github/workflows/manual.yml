name: manual test
on:
  workflow_dispatch

jobs:
  do-some:
    runs-on: ubuntu-latest
    environment: develop
    env:
       NODE_VERSION: 22
    steps:
      - name: 1 read local
        run: echo "my local node is ${{ env.NODE_VERSION }}"

      - name: 2 read env var
        run: echo "my local node is ${{ vars.NODE_VERSION }}"

      - name: 3 read env var
        run: echo "my environment node is $NODE_VERSION"

      - name: Read package.json node version
        uses: culshaw/read-package-node-version-actions@v1
        id: package-node-version
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.package-node-version.outputs.version }}
      - run: node --version
